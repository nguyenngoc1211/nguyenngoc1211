<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
<defs>
  <radialGradient id="rad" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#151A17"/>
    <stop offset="1" stop-color="#090B0A"/>
  </radialGradient>
  <filter id="rg">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1400" height="420" rx="18" fill="#0A0B0C"/>
<text x="35" y="45" font-family="monospace" font-size="14" fill="#746E65" letter-spacing="3">SOC MONITOR // LIVE SIGNAL</text>

<!-- left console -->
<rect x="35" y="75" width="800" height="305" rx="10" fill="#070909" stroke="#272A27"/>

<g transform="translate(245 228)">
  <circle r="118" fill="url(#rad)" stroke="#3A4439"/>
  <circle r="88" fill="none" stroke="#374238" stroke-opacity=".8"/>
  <circle r="58" fill="none" stroke="#374238" stroke-opacity=".7"/>
  <circle r="28" fill="none" stroke="#374238" stroke-opacity=".6"/>
  <line x1="-118" y1="0" x2="118" y2="0" stroke="#374238"/>
  <line x1="0" y1="-118" x2="0" y2="118" stroke="#374238"/>

  <g>
    <line x1="0" y1="0" x2="108" y2="0" stroke="#F5A623" stroke-width="3" filter="url(#rg)"/>
    <path d="M0 0 L108 0 A108 108 0 0 1 70 83 Z" fill="#F5A623" opacity=".08"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
  </g>

  <circle cx="52" cy="-34" r="5" fill="#FF4D4D" filter="url(#rg)">
    <animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="-65" cy="58" r="4" fill="#F5A623" filter="url(#rg)">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</g>

<text x="420" y="125" font-family="monospace" font-size="13" fill="#746E65">DETECTION FEED</text>
<text x="420" y="165" font-family="monospace" font-size="15" fill="#D8D2C4">[INFO] telemetry stream connected</text>
<text x="420" y="198" font-family="monospace" font-size="15" fill="#D8D2C4">[INFO] parsing security events</text>
<text x="420" y="231" font-family="monospace" font-size="15" fill="#F5A623">[HUNT] suspicious behavior queued</text>
<text x="420" y="264" font-family="monospace" font-size="15" fill="#FF4D4D">[ALERT] anomaly candidate detected</text>
<text x="420" y="297" font-family="monospace" font-size="15" fill="#D8D2C4">[NOTE] analyst review required</text>
<text x="420" y="338" font-family="monospace" font-size="15" fill="#6E786C">ngoc@soc:~$ _</text>

<!-- right stat panel -->
<rect x="870" y="75" width="495" height="305" rx="10" fill="#090A0B" stroke="#302D29"/>
<text x="900" y="118" font-family="monospace" font-size="13" fill="#746E65" letter-spacing="3">OPERATIONAL READINESS</text>

<text x="900" y="163" font-family="monospace" font-size="15" fill="#D8D2C4">THREAT DETECTION</text>
<rect x="900" y="176" width="410" height="6" fill="#242424"/>
<rect x="900" y="176" width="360" height="6" fill="#A71919"/>

<text x="900" y="221" font-family="monospace" font-size="15" fill="#D8D2C4">THREAT HUNTING</text>
<rect x="900" y="234" width="410" height="6" fill="#242424"/>
<rect x="900" y="234" width="330" height="6" fill="#F5A623"/>

<text x="900" y="279" font-family="monospace" font-size="15" fill="#D8D2C4">CTF RESEARCH</text>
<rect x="900" y="292" width="410" height="6" fill="#242424"/>
<rect x="900" y="292" width="385" height="6" fill="#8F1D1D"/>

<text x="900" y="342" font-family="monospace" font-size="13" fill="#6E665E">STATUS: OPERATIONAL</text>
</svg>
