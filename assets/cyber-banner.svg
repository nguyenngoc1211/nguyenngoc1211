<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#050816"/>
    <stop offset=".52" stop-color="#0b1026"/>
    <stop offset="1" stop-color="#07030f"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" x2="1">
    <stop offset="0" stop-color="#00f5ff"/>
    <stop offset=".5" stop-color="#9d4edd"/>
    <stop offset="1" stop-color="#ff2e88"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f5ff" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <clipPath id="panel"><rect x="28" y="28" width="1144" height="354" rx="16"/></clipPath>
</defs>

<rect width="1200" height="410" rx="22" fill="url(#bg)"/>
<rect width="1200" height="410" rx="22" fill="url(#grid)"/>
<rect x="28" y="28" width="1144" height="354" rx="16" fill="none" stroke="url(#neon)" stroke-width="2"/>
<path d="M28 92H1172" stroke="#00f5ff" stroke-opacity=".25"/>
<path d="M805 92V382" stroke="#9d4edd" stroke-opacity=".22"/>

<!-- corner accents -->
<path d="M28 65V28H90" fill="none" stroke="#00f5ff" stroke-width="5" filter="url(#glow)"/>
<path d="M1110 382H1172V320" fill="none" stroke="#ff2e88" stroke-width="5" filter="url(#glow)"/>

<text x="60" y="67" fill="#8b9bb4" font-size="15" font-family="monospace" letter-spacing="3">CYBER OPERATIONS // PROFILE NODE 0xNGOC</text>
<circle cx="1090" cy="58" r="6" fill="#39ff14" filter="url(#glow)"/>
<text x="1105" y="64" fill="#39ff14" font-size="14" font-family="monospace">ONLINE</text>

<text x="62" y="160" fill="#ffffff" font-size="58" font-weight="800" font-family="Arial,Helvetica,sans-serif" letter-spacing="4">NGUYEN VAN NGOC</text>
<rect x="62" y="182" width="675" height="3" fill="url(#neon)" filter="url(#glow)"/>
<text x="62" y="223" fill="#00f5ff" font-size="23" font-family="monospace" letter-spacing="3">INFORMATION SECURITY @ PTIT</text>
<text x="62" y="264" fill="#c7d2fe" font-size="18" font-family="monospace">SOC  //  THREAT DETECTION  //  THREAT HUNTING  //  CTF</text>

<text x="62" y="320" fill="#6ee7f9" font-size="14" font-family="monospace">MISSION</text>
<text x="62" y="346" fill="#ffffff" font-size="17" font-family="monospace">UNDERSTAND ATTACKS. FIND TRACES. BUILD DETECTIONS.</text>

<!-- status block -->
<text x="845" y="137" fill="#a9b6cc" font-size="14" font-family="monospace" letter-spacing="2">SYSTEM MODULES</text>
<text x="845" y="178" fill="#fff" font-size="15" font-family="monospace">SOC ENGINE</text>
<text x="1095" y="178" fill="#39ff14" font-size="15" font-family="monospace" text-anchor="end">READY</text>
<rect x="845" y="188" width="250" height="5" rx="2" fill="#172033"/>
<rect x="845" y="188" width="235" height="5" rx="2" fill="#00f5ff" filter="url(#glow)"/>

<text x="845" y="226" fill="#fff" font-size="15" font-family="monospace">THREAT HUNTER</text>
<text x="1095" y="226" fill="#ff2e88" font-size="15" font-family="monospace" text-anchor="end">ACTIVE</text>
<rect x="845" y="236" width="250" height="5" rx="2" fill="#172033"/>
<rect x="845" y="236" width="220" height="5" rx="2" fill="#9d4edd" filter="url(#glow)"/>

<text x="845" y="274" fill="#fff" font-size="15" font-family="monospace">CTF WORKSPACE</text>
<text x="1095" y="274" fill="#00f5ff" font-size="15" font-family="monospace" text-anchor="end">MOUNTED</text>
<rect x="845" y="284" width="250" height="5" rx="2" fill="#172033"/>
<rect x="845" y="284" width="245" height="5" rx="2" fill="#ff2e88" filter="url(#glow)"/>

<text x="845" y="329" fill="#7385a5" font-size="12" font-family="monospace">github.com/nguyenngoc1211</text>

<!-- moving scanline -->
<g clip-path="url(#panel)" opacity=".16">
  <rect x="28" y="-25" width="1144" height="32" fill="#00f5ff">
    <animate attributeName="y" from="-25" to="410" dur="5s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
