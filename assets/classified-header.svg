<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#070808"/>
    <stop offset="0.6" stop-color="#0B0D0F"/>
    <stop offset="1" stop-color="#120808"/>
  </linearGradient>
  <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.8" fill="#D8D2C4" opacity=".035"/>
    <circle cx="12" cy="9" r="0.6" fill="#D8D2C4" opacity=".025"/>
    <circle cx="17" cy="17" r="0.7" fill="#D8D2C4" opacity=".03"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1400" height="560" rx="20" fill="url(#bg)"/>
<rect width="1400" height="560" rx="20" fill="url(#grain)"/>

<!-- red dossier stripe -->
<rect x="0" y="0" width="16" height="560" fill="#A71919"/>
<rect x="45" y="34" width="1310" height="492" rx="8" fill="none" stroke="#3A2F2F" stroke-width="1.5"/>

<!-- top labels -->
<text x="78" y="78" font-family="monospace" font-size="15" fill="#8B8377" letter-spacing="4">SECURITY OPERATIONS DOSSIER</text>
<text x="1318" y="78" font-family="monospace" font-size="15" fill="#F5A623" text-anchor="end">FILE // 0xNGOC</text>

<!-- main title -->
<text x="78" y="190" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" fill="#EFE9DD" letter-spacing="1">NGUYEN VAN NGOC</text>
<text x="80" y="236" font-family="monospace" font-size="19" fill="#B9B1A1" letter-spacing="4">INFORMATION SECURITY @ PTIT</text>

<!-- divider -->
<line x1="78" y1="275" x2="900" y2="275" stroke="#A71919" stroke-width="3"/>
<line x1="905" y1="275" x2="1318" y2="275" stroke="#3A2F2F" stroke-width="1"/>

<!-- focus block -->
<text x="80" y="325" font-family="monospace" font-size="14" fill="#7C756B" letter-spacing="3">PRIMARY SPECIALIZATION</text>
<text x="80" y="365" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#FF4D4D">SOC / THREAT DETECTION</text>

<text x="80" y="415" font-family="monospace" font-size="14" fill="#7C756B" letter-spacing="3">SECONDARY</text>
<text x="80" y="450" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#D8D2C4">THREAT HUNTING / CTF / DFIR</text>

<!-- right status -->
<rect x="1000" y="145" width="318" height="302" rx="8" fill="#0A0B0C" stroke="#3A2F2F"/>
<text x="1030" y="182" font-family="monospace" font-size="13" fill="#7C756B" letter-spacing="3">OPERATOR STATUS</text>

<text x="1030" y="230" font-family="monospace" font-size="15" fill="#D8D2C4">CLEARANCE</text>
<text x="1278" y="230" font-family="monospace" font-size="15" fill="#F5A623" text-anchor="end">BLUE TEAM</text>

<text x="1030" y="273" font-family="monospace" font-size="15" fill="#D8D2C4">STATUS</text>
<text x="1278" y="273" font-family="monospace" font-size="15" fill="#FF4D4D" text-anchor="end">ACTIVE</text>

<text x="1030" y="316" font-family="monospace" font-size="15" fill="#D8D2C4">PROFILE</text>
<text x="1278" y="316" font-family="monospace" font-size="15" fill="#D8D2C4" text-anchor="end">PUBLIC</text>

<text x="1030" y="359" font-family="monospace" font-size="15" fill="#D8D2C4">NODE</text>
<text x="1278" y="359" font-family="monospace" font-size="15" fill="#D8D2C4" text-anchor="end">GITHUB</text>

<!-- stamp -->
<g transform="translate(1120 405) rotate(-7)">
  <rect x="-82" y="-32" width="164" height="64" fill="none" stroke="#A71919" stroke-width="4"/>
  <text x="0" y="8" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#A71919" text-anchor="middle" letter-spacing="2">CLASSIFIED</text>
</g>

<!-- animated scanner line -->
<rect x="45" y="20" width="1310" height="3" fill="#FF4D4D" opacity=".08">
  <animate attributeName="y" from="20" to="525" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>
