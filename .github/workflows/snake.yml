name: Contribution Trace

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution trace
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF4D4D&color_dots=%230B0D0F,%23261A1A,%237A1515,%23A71919,%23F5A623
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF4D4D&color_dots=%230B0D0F,%23261A1A,%237A1515,%23A71919,%23F5A623

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
