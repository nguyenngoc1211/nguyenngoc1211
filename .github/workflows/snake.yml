name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300f5ff&color_dots=%230d1117,%2312263a,%2300b4d8,%239d4edd,%23ff2e88
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300f5ff&color_dots=%230d1117,%2312263a,%2300b4d8,%239d4edd,%23ff2e88
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake to output branch
        shell: bash
        run: |
          set -e
          cp -r dist /tmp/snake-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/snake-dist/* .
          git add .
          git commit -m "chore: update contribution snake"
          git push --force origin output
